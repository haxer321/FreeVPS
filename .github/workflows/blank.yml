name: Mine Monero XMR - Kryptex Pool (CPU via XMRig)

on:
  workflow_dispatch:  # Run manually from the Actions tab

jobs:
  mine-monero:
    runs-on: ubuntu-latest  # Change to [self-hosted, linux] if using your own runner!
                            # GitHub-hosted runners block mining pools → use self-hosted for real mining

    steps:
      - name: Install build dependencies
        run: |
          sudo apt-get update -y
          sudo apt-get install -y \
            git \
            build-essential \
            cmake \
            libuv1-dev \
            libssl-dev \
            libhwloc-dev

      - name: Clone and build latest XMRig
        run: |
          git clone https://github.com/xmrig/xmrig.git
          mkdir xmrig/build && cd xmrig/build
          cmake .. -DWITH_HWLOC=ON -DCMAKE_BUILD_TYPE=Release
          make -j$(nproc)

      - name: Create config.json with your address
        run: |
          cd xmrig/build
          cat > config.json << 'EOF'
          {
              "autosave": true,
              "cpu": true,
              "opencl": false,
              "cuda": false,
              "pools": [
                  {
                      "algo": "rx/0",
                      "coin": "monero",
                      "url": "xmr.kryptex.network:7029",
                      "user": "461ys28cKUvdh7JLedMUPu7QDE5CVaSyU35QtzJ9WwFS7pk4UA8fnncD6JtANLhgDSQFWT5YSADmpV6vwZh29S769kptmTm/Youssif-Rig-${{ github.run_id }}",
                      "pass": "x",
                      "tls": false,
                      "keepalive": true,
                      "nicehash": false
                  }
              ],
              "donate-level": 0,
              "donate-over-proxy": 0
          }
          EOF

      - name: Start mining
        run: |
          cd xmrig/build
          ./xmrig --config=config.json --no-color --print-time=10
